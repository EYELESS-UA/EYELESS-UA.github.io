<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Primary Meta Tags -->
    <title>«L Games Studo» — українські локалізації ігор</title>
    <meta name="title" content="L Games Studo» — українські локалізації ігор" />
    <meta name="description" content="Українські локалізації відеоігор:" />

    <!-- Cache control -->
    <meta http-equiv="Cache-Control" content="max-age=3600, must-revalidate">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=1.4.1">
</head>
<body>

    <div class="ambient-bg">
        <canvas id="bg-canvas" aria-hidden="true"></canvas>
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
        <div class="noise-overlay"></div>
    </div>

    <nav class="glass-nav">
        <div class="container nav-inner">
            <div class="logo">«L Games Studo</span>»</div>
            <div class="nav-items">
                <a href="#projects" class="nav-link" data-i18n="nav_projects">Проєкти</a>
                <a href="#news" class="nav-link" data-i18n="nav_news">Новини</a>
                <a href="#support" class="nav-link" data-i18n="nav_support">Підтримка</a>
<!--                <a href="#contacts" class="nav-link" data-i18n="nav_contacts">Контакти</a> -->
                <div class="lang-toggle" role="tablist" aria-label="Language switcher">
                    <button class="lang-opt active" onclick="setLang('uk')" aria-pressed="true" title="Українська">
                        <!-- Ukrainian flag (simple) -->
                        <svg class="flag flag-ukr" width="20" height="14" viewBox="0 0 20 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <rect width="20" height="14" fill="#0057b7" />
                            <rect y="7" width="20" height="7" fill="#ffd700" />
                        </svg>
                        <span class="lang-label">UA</span>
                    </button>
                    <button class="lang-opt" onclick="setLang('en')" aria-pressed="false" title="English">
                        <!-- UK flag (stylized simplified) -->
                        <svg class="flag flag-gb" width="20" height="14" viewBox="0 0 20 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <rect width="20" height="14" fill="#012169" />
                            <path d="M0 0 L20 14 M20 0 L0 14" stroke="#fff" stroke-width="3" />
                            <path d="M0 0 L20 14 M20 0 L0 14" stroke="#C8102E" stroke-width="1.6" />
                            <rect x="8.1" width="3.8" height="14" fill="#fff" />
                            <rect y="5.1" width="20" height="3.8" fill="#fff" />
                            <rect x="9.4" width="1.2" height="14" fill="#C8102E" />
                            <rect y="6.4" width="20" height="1.2" fill="#C8102E" />
                        </svg>
                        <span class="lang-label">EN</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h1 data-i18n="hero_title">Граємо українською</h1>
            <p class="hero-lead" data-i18n="hero_lead">бо любимо ці історії всім серцем.</p>

            <div class="hero-stats">
                <div class="stat">
                    <span class="stat-val" id="stat-done">0</span>
                    <span class="stat-lbl" data-i18n="stat_done">ГОТОВО</span>
                </div>
                <div class="stat">
                    <span class="stat-val" id="stat-progress">0</span>
                    <span class="stat-lbl" data-i18n="stat_progress">В ПРОЦЕСІ</span>
                </div>
                <div class="stat">
                    <span class="stat-val" id="stat-planned">0</span>
                    <span class="stat-lbl" data-i18n="stat_planned">ЗАПЛАНОВАНО</span>
                </div>
            </div>
        </section>

        <div class="controls">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" placeholder="Пошук..." data-i18n-placeholder="search_ph">
            </div>
            <div class="filters">
                <button class="f-btn active" data-filter="all" data-i18n="filter_all">Всі</button>
                <button class="f-btn" data-filter="done" data-i18n="filter_done">Готово</button>
                <button class="f-btn" data-filter="in-progress" data-i18n="filter_in_progress">В процесі</button>
            </div>
        </div>

        <section id="projects" class="projects-grid"></section>
        
        <div class="load-more-container">
            <button id="load-more-btn" class="btn-load-more" data-i18n="btn_load_more">Завантажити ще</button>
        </div>

        <section id="news" class="news-section">
            <div class="news-header">
                <h2 data-i18n="news_title">НОВИНИ</h2>
            </div>
            <div id="news-grid" class="news-grid"></div>
        </section>

        <section id="support" class="support-section">
            <div class="container">
                <div class="support-header">
                    <h2 data-i18n="support_title">Фінансова підтримка</h2>
                    <p data-i18n="support_text" class="support-lead">Підтримайте нас донатом, і ми зможемо швидше випускати нові українські локалізації</p>
                </div>

                <div class="support-card-wrapper">
                    <a href="https://donatello.to/LGamesStudio" target="_blank" class="support-donate-card">
                        <div class="donate-bg"></div>
                        <div class="donate-gradient"></div>
                        <div class="donate-content">
                            <div class="donate-icon">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

                            <div class="donate-link">
                                <span>Підтримати</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                                </svg>
                            </div>
                        </div>
                        <div class="donate-particles">
                            <div class="particle"></div>
                            <div class="particle"></div>
                            <div class="particle"></div>
                        </div>
                    </a>

                   
                </div>

        </section>

    <div id="modal" class="modal-backdrop">
        <div class="modal-content">
            <button class="modal-close">✕</button>
            <div class="modal-body">
                <div style="text-align: center;">
                    <img id="m-logo" class="m-logo" src="" alt="">
                </div>
                <div id="m-gallery-slider" class="gallery-slider-container" style="display:none; margin-bottom:20px">
                    <div class="gallery-slider-wrapper">
                        <div id="m-gallery-track" class="gallery-track"></div>
                        <button class="gallery-nav gallery-nav-prev" aria-label="Попередній слайд">‹</button>
                        <button class="gallery-nav gallery-nav-next" aria-label="Наступний слайд">›</button>
                    </div>
                    <div class="gallery-dots"></div>
                </div>
                <div id="m-stats" class="stats-box"></div>
                <p id="m-desc" style="color:#cbd5e1; line-height:1.6; margin-bottom:20px"></p>
                <div id="m-video"></div>
                <div id="m-actions" style="display:flex; gap:10px"></div>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Viewer -->
    <div id="fullscreen-viewer" class="fullscreen-viewer">
        <button class="fullscreen-close" aria-label="Закрити">✕</button>
        <img id="fullscreen-image" src="" alt="Fullscreen view">
    </div>
